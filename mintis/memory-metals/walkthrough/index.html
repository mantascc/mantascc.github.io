<header><div><p class="eyebrow">Case file 001 / 4 November 2026</p><h1>Memory Metals</h1></div><p class="edition">A data walkthrough</p></header>
<main><div class="deck"><aside><p class="eyebrow">Chapters</p><nav id="chapters" aria-label="Walkthrough chapters"></nav></aside><div class="stage">
<div id="plates"><figure class="plate" hidden>
      <div class="plate-head"><span>Plate 01 · Nitinol</span><span>Heating vs cooling</span></div>
      <div class="svgbox" id="p-hyst"></div>
      <figcaption>The shape returns on heating and is lost on cooling at a lower temperature. The gap between the two curves is hysteresis. Insets: the high-temperature cubic cell (austenite) and the sheared low-temperature form (martensite). Illustrative shape.</figcaption>
    </figure><figure class="plate" hidden>
      <div class="plate-head"><span>Plate 02 · Terfenol-D, Galfenol</span><span>Strain in a field, log scale</span></div>
      <div class="svgbox" id="p-magneto"></div>
      <figcaption>Approximate maximum magnetostrictive strain in parts per million. Pure iron barely moves; the Navy alloys move one to two orders of magnitude more. Commonly cited values, rounded.</figcaption>
    </figure><figure class="plate" hidden>
      <div class="plate-head"><span>Plate 03 · Cantor alloy</span><span>5 × 20 at.%</span></div>
      <div class="svgbox" id="p-cantor"></div>
      <figcaption>Five principal elements at 20 atomic percent each. Instead of a brittle mixture of phases, the melt settles into a single face-centered cubic crystal. Each mark style is one element, placed at random on one shared lattice.</figcaption>
    </figure><figure class="plate" hidden>
      <div class="plate-head"><span>Plate 04 · Vitreloy</span><span>Crystal vs glass</span></div>
      <div class="svgbox" id="p-glass"></div>
      <figcaption>Left, an ordinary crystal. Right, five elements of very different atomic sizes jam each other while cooling and freeze before they can line up. No grains, so no grain boundaries to fail along.</figcaption>
    </figure><figure class="plate" hidden>
    <div class="plate-head"><span>Plate 05 · Nitinol composition</span><span>Weight % shown with atomic %</span></div>
    <div class="svgbox" id="p-comp"></div>
    <figcaption>Top axis: nickel in weight percent, as NOL named its alloys. Bottom axis: the same composition in atomic percent. The band is the industry range for binary nitinol. The curve shows the direction of the effect (nickel-rich alloys transform colder), not measured values. Small ticks: the kind of composition series a 1950s screening program would cast.</figcaption>
  </figure><figure class="plate" hidden>
    <div class="plate-head"><span>Plate 06 · The proposed network</span><span>Solid: on the record · Dashed: alleged</span></div>
    <div class="svgbox" id="p-network"></div>
    <figcaption>Solid lines are relationships with a document behind them. Dashed lines are relationships people allege or theorize. The dashed web is the "hidden network" hypothesis; the solid web is what can be checked today.</figcaption>
  </figure><figure class="plate" hidden>
    <div class="plate-head"><span>Plate 07 · Disclosure timeline</span><span>2004 to 2026</span></div>
    <div class="svgbox" id="p-timeline"></div>
    <figcaption>Each event is marked with its claim type. The cluster on the right is the current administration's disclosure program.</figcaption>
  </figure><figure class="plate" hidden>
    <div class="plate-head"><span>Plate 08 · Magnesium isotopes</span><span>²⁴Mg · ²⁵Mg · ²⁶Mg</span></div>
    <div class="svgbox" id="p-iso"></div>
    <figcaption>Earth's magnesium is about 79 / 10 / 11 percent across its three stable isotopes. The Powell study's fragment falls inside that. Nolan's reported anomalous fragment is drawn hatched because its values have not been published.</figcaption>
  </figure><figure class="plate" hidden>
    <div class="plate-head"><span>Plate 09 · Complexity matrix</span><span>Filled = more demanding</span></div>
    <div class="svgbox" id="p-matrix"></div>
    <figcaption>The surprising part is how much complexity we already know how to build. Cantor alloy and Vitreloy each combine five main elements, while the alleged samples here tend to have fewer. Their intriguing claim lies elsewhere: unusual isotope ratios. The half-filled circles mark that possibility, but the numbers behind those claims remain unpublished. The two middle columns are this case file’s comparative ratings, rather than laboratory measurements.</figcaption>
  </figure></div>
