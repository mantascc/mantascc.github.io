<style>
  :root { --paper:#efede8; --ink:#141414; --line:color-mix(in srgb, var(--ink) 16%, transparent); --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; --col:800px; }
  @media (prefers-color-scheme: dark) { :root { --paper:#121212; --ink:#ebe8e1; } }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:13px/1.4 var(--mono); overflow:hidden; }
  body { position:relative; display:grid; grid-template-rows:1fr auto; height:100dvh; }
  #stage { position:relative; min-height:0; width:100%; max-width:var(--col); margin:0 auto; cursor:pointer; }
  #c { position:absolute; inset:0; width:100%; height:100%; display:block; }
  footer { position:relative; z-index:5; border-top:1px solid var(--line); padding:0 max(20px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(20px, env(safe-area-inset-left)); }
  .controls { max-width:calc(var(--col) - 40px); margin:0 auto; height:72px; display:grid; grid-template-columns:auto 1fr; align-items:center; gap:20px; }
  .transport { display:flex; align-items:center; gap:4px; }
  #play { margin-right:8px; }
  button { font:inherit; color:inherit; background:none; border:0; width:40px; height:40px; display:grid; place-items:center; cursor:pointer; padding:0; border-radius:50%; transition:opacity .12s, background-color .12s; }
  button svg { width:14px; height:14px; }
  button:focus-visible { outline:1px solid var(--ink); outline-offset:2px; }
  button[disabled] { opacity:.3; cursor:default; }
  @media (hover:hover) { #prev:not(:disabled):hover, #next:not(:disabled):hover { background:var(--line); } }
  #play { width:44px; height:44px; background:var(--accent, var(--ink)); color:var(--paper); }
  #play svg { width:14px; height:14px; }
  @media (hover:hover) { #play:not(:disabled):hover { opacity:.85; } }
  #name { position:absolute; left:50%; transform:translateX(-50%); width:auto; max-width:calc(100% - 40px); height:40px; border-radius:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 8px; display:block; text-align:center; font-size:14px; }
  @media (hover:hover) { #name:hover { text-decoration:underline; text-underline-offset:4px; } }
  #name span, #time span { opacity:.45; }
  #time { font-variant-numeric:tabular-nums; white-space:nowrap; justify-self:end; }
  @media (max-width:480px) { .controls { gap:12px; } }
  #index { position:absolute; left:50%; width:min(var(--col), 100%); bottom:calc(100% + 1px); background:var(--paper); border:1px solid var(--line); border-bottom:0; max-height:60dvh; overflow-y:auto; transform:translate(-50%, 8px); opacity:0; pointer-events:none; transition:opacity .15s, transform .15s; }
  #index.open { transform:translate(-50%, 0); opacity:1; pointer-events:auto; }
  #index ol { list-style:none; margin:0; padding:0; }
  #toast { position:fixed; z-index:10; top:max(16px, env(safe-area-inset-top)); left:50%; display:flex; align-items:center; gap:10px; padding:10px 18px 10px 14px; background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:999px; box-shadow:0 8px 28px rgba(0,0,0,.08); white-space:nowrap; pointer-events:none; transform:translate(-50%, calc(-100% - 32px)); opacity:0; }
  #toast.show { animation:toast 11.1s .5s both; }
  #toast svg { width:16px; height:16px; flex:none; }
  @keyframes toast {
    0% { transform:translate(-50%, calc(-100% - 32px)); opacity:0; animation-timing-function:cubic-bezier(.2,.8,.2,1); }
    5.4%, 95.5% { transform:translate(-50%, 0); opacity:1; }
    95.5% { animation-timing-function:cubic-bezier(.6,0,.8,.2); }
    100% { transform:translate(-50%, calc(-100% - 32px)); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce) { #toast.show { animation-name:toast-fade; } @keyframes toast-fade { 0%, 100% { opacity:0; transform:translate(-50%, 0); } 5.4%, 95.5% { opacity:1; transform:translate(-50%, 0); } } }
  #index li button { width:100%; height:56px; border:0; border-radius:0; border-bottom:1px solid var(--line); display:grid; grid-template-columns:4ch 36px 1fr auto; gap:16px; align-items:center; justify-items:start; text-align:left; padding:0 20px; }
  #index li:last-child button { border-bottom:0; }
  @media (hover:hover) { #index li button:hover { background:var(--line); } }
  #index li button span:last-child { justify-self:end; }
  #index li button span:first-child, #index li button span:last-child { opacity:.45; font-variant-numeric:tabular-nums; }
  #index li button[aria-current=true] { color:var(--accent); }
  #index li button[aria-current=true] span { opacity:1; }
</style>
