<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mantas — designer, technologist.">
  <title>mantas.cc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ffc252; color-scheme: dark; font-family: 'JetBrains Mono', monospace; background: #101211; color: #eeeee8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    main { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 8px; font-size: 12px; font-weight: 400; line-height: 1.8; text-align: center; }
    .item { white-space: nowrap; }
    .separator { color: #737b70; }
    a { color: inherit; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #737b70; }
    a:hover { color: var(--accent); text-decoration-color: currentColor; }
    a:focus-visible { outline: 1px solid currentColor; outline-offset: 5px; }
    @media (max-width: 560px) {
      main { display: grid; grid-template-columns: auto auto auto; gap: 6px 8px; align-items: center; }
      main > :nth-child(1), main > :nth-child(3) { grid-column: 1 / -1; }
      main > :nth-child(2), main > :nth-child(4) { display: none; }
      main a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 8px 4px; }
    }
    .wanderer { position: fixed; top: 0; left: 0; width: 24px; height: 24px; pointer-events: none; opacity: 0; will-change: transform; filter: drop-shadow(0 2px 3px #000a); }
    .wanderer svg { display: block; width: 100%; height: 100%; transform: rotate(-135deg); }
    @media (prefers-reduced-motion: reduce) { .wanderer { display: none; } }
  </style>
</head>
<body>
  <main aria-label="Mantas — designer, technologist">
    <span class="item">mantas.cc</span>
    <span class="separator" aria-hidden="true">/</span>
    <span class="item">designer, technologist</span>
    <span class="separator" aria-hidden="true">/</span>
    <a class="item" href="mailto:mantas.lilis@gmail.com">email</a>
    <span class="separator" aria-hidden="true">/</span>
    <a class="item" href="https://linkedin.com/in/mantaslilis" rel="me">linkedin</a>
  </main>
  <div class="wanderer" aria-hidden="true">
    <svg viewBox="-8 -8 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="flame" x1="7" y1="0" x2="-6" y2="4" gradientUnits="userSpaceOnUse"><stop stop-color="#ffe590"/><stop offset=".55" stop-color="#ffc252"/><stop offset="1" stop-color="#ed792d"/></linearGradient></defs>
      <path d="M7 0 -5.5 -5 -2.5 0 -5.5 5Z" fill="url(#flame)" stroke="#ffc764" stroke-width=".45" stroke-linejoin="round"/>
    </svg>
  </div>
  <script src="wander.js" defer></script>
</body>
</html>
